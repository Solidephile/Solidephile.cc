name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout main
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Checkout osu_data
      - name: Checkout osu_data
        uses: actions/checkout@v4
        with:
          ref: osu_data
          path: osu_data_branch
          fetch-depth: 1

      # 3. Copy history into public/data
      - name: Prepare osu history
        run: |
          mkdir -p public/data
          cp osu_data_branch/data/osu_history.json public/data/osu_history.json

      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 5. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 6. Update osu data
      - name: Update osu stats
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
          OSU_USERNAME: ${{ secrets.OSU_USERNAME }}
          UPDATE_HISTORY: "true"
        run: node scripts/update_osu.cjs

      # 7. Save updated history to osu_data
      - name: Save osu history
        run: |
          cp public/data/osu_history.json osu_data_branch/data/osu_history.json

          cd osu_data_branch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/osu_history.json

          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "Update osu history"
            git push origin osu_data
          fi

      # 8. Build React
      - name: Build React
        run: npm run build

      # 9. Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 10. Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 11. Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4