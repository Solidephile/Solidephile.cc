name: Debug osu Stats and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # =========================
  # Build
  # =========================

  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout main
      - name: Checkout main
        uses: actions/checkout@v4


      # 2. Checkout osu_data (read only)
      - name: Checkout osu_data
        uses: actions/checkout@v4
        with:
          ref: osu_data
          path: osu_data_branch


      # 3. Prepare osu history
      - name: Prepare osu history
        run: |
          mkdir -p public/data
          cp osu_data_branch/data/osu_history.json public/data/osu_history.json


      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # 5. Install dependencies
      - name: Install dependencies
        run: npm ci


      # 6. Update osu stats
      - name: Update osu stats
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
          OSU_USERNAME: Solidephile
          UPDATE_HISTORY: "false"
        run: |
          node scripts/update_osu.js


      # 7. Build React app
      - name: Build React app
        run: npm run build


      # 8. Show files to deploy
      - name: Show build output
        run: |
          echo "=== Files to deploy ==="
          find dist -type f


      # 9. Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5


      # 10. Upload website
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


  # =========================
  # Deploy
  # =========================

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4